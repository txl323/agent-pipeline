<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Pipeline</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #f7f7f8; --panel: #ffffff; --border: #ececf1; --border-2: #d8dae2;
    --text: #1a1a2e; --text-sub: #666; --text-dim: #999;
    --primary: #4a6cf7; --primary-hover: #3d5de6;
    --shadow: 0 1px 3px rgba(26,26,46,.06), 0 4px 14px rgba(26,26,46,.05);
    --hover-bg: #fafafc; --header-bg: rgba(255,255,255,.82);
    --code-bg: #f7f8fc; --th-bg: #f7f8fc;
  }
  body.dark {
    --bg: #131417; --panel: #1d1e24; --border: #2a2b35; --border-2: #3a3b47;
    --text: #e8e9f0; --text-sub: #b9bac6; --text-dim: #7a7c8c;
    --primary: #5d7dff; --primary-hover: #6f8dff;
    --shadow: 0 1px 3px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.22);
    --hover-bg: #262732; --header-bg: rgba(29,30,36,.85);
    --code-bg: #262732; --th-bg: #262732;
  }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: var(--bg); height: 100vh; display: flex; transition: background .25s; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: rgba(128,130,150,.35); border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: rgba(128,130,150,.55); }
  ::-webkit-scrollbar-track { background: transparent; }
  /* ---- 侧栏 ---- */
  #sidebar { width: 240px; background: #1e1f26; color: #d7d8e0; display: flex;
             flex-direction: column; flex-shrink: 0; }
  #sidebar .brand { padding: 16px 18px 12px; font-size: 15px; font-weight: 600;
                    color: #fff; letter-spacing: .5px; }
  #newchat { margin: 4px 12px 12px; background: #4a6cf7; color: #fff; border: none;
             border-radius: 10px; padding: 9px 0; font-size: 13.5px; cursor: pointer;
             transition: background .15s; }
  #newchat:hover { background: #3d5de6; }
  #convlist { flex: 1; overflow-y: auto; padding: 4px 8px; }
  .conv-item { padding: 9px 12px; border-radius: 9px; cursor: pointer; font-size: 13px;
               display: flex; align-items: center; justify-content: space-between;
               margin-bottom: 2px; color: #b9bac6; }
  .conv-item:hover { background: #2a2b35; color: #e8e9f0; }
  .conv-item.active { background: #313244; color: #fff; }
  .conv-item .ctitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .conv-item .cdel { visibility: hidden; color: #888; font-size: 14px; padding: 0 2px;
                     border: none; background: none; cursor: pointer; flex-shrink: 0; }
  .conv-item:hover .cdel { visibility: visible; }
  .conv-item .cdel:hover { color: #ff6b6b; }
  #sidebar .foot { padding: 10px 16px; font-size: 11px; color: #666878; }
  /* ---- 主区 ---- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { background: var(--header-bg); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
           border-bottom: 1px solid var(--border); padding: 10px 20px;
           display: flex; justify-content: space-between; align-items: center;
           position: sticky; z-index: 5; }
  header .title { font-size: 14px; font-weight: 600; color: var(--text); }
  .hright { display: flex; align-items: center; gap: 10px; }
  #status { font-size: 12px; color: var(--text-dim); }
  #themeToggle { border: 1px solid var(--border-2); background: var(--panel); border-radius: 8px;
                 width: 30px; height: 30px; cursor: pointer; font-size: 14px; line-height: 1;
                 color: var(--text-sub); display: inline-flex; align-items: center; justify-content: center;
                 transition: transform .15s; }
  #themeToggle:hover { transform: scale(1.08); }
  #chat { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .turn { max-width: 780px; margin: 0 auto 20px; }
  .msg-user { display: flex; justify-content: flex-end; margin-bottom: 12px; }
  .msg-user .bubble { background: var(--primary); color: #fff; border-radius: 14px;
                      border-bottom-right-radius: 4px; padding: 10px 14px;
                      font-size: 14px; line-height: 1.6; max-width: 85%; white-space: pre-wrap;
                      box-shadow: var(--shadow); }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
           margin-bottom: 10px; font-size: 13px; overflow: hidden; box-shadow: var(--shadow); }
  .panel .head { padding: 8px 12px; cursor: pointer; user-select: none;
                 display: flex; align-items: center; gap: 6px; color: var(--text-sub); }
  .panel .head:hover { background: var(--hover-bg); }
  .panel .head .arrow { transition: transform .2s; font-size: 10px; color: var(--text-dim); }
  .panel.open .head .arrow { transform: rotate(90deg); }
  .panel .body { display: none; padding: 4px 14px 10px; color: var(--text-sub);
                 line-height: 1.7; white-space: pre-wrap; word-break: break-word;
                 max-height: 300px; overflow-y: auto; }
  .panel.open .body { display: block; }
  .panel.thinking .head { color: #9b7ede; }
  .panel.thinking .body { color: #8a7bb0; font-size: 12.5px; }
  .panel.tool .head { color: #4a8a5c; }
  .msg-ai { background: var(--panel); border: 1px solid var(--border); border-radius: 14px;
            border-top-left-radius: 4px; padding: 12px 16px; font-size: 14px;
            line-height: 1.75; white-space: pre-wrap; word-break: break-word;
            box-shadow: var(--shadow); }
  .msg-ai.empty { display: none; }
  .ai-block { position: relative; }
  .ai-actions { display: flex; gap: 6px; margin-top: 6px; opacity: 0;
                transition: opacity .15s; }
  .ai-block:hover .ai-actions { opacity: 1; }
  .ai-act { border: 1px solid var(--border-2); background: var(--panel); color: var(--text-sub);
            border-radius: 6px; font-size: 11.5px; padding: 2px 10px; cursor: pointer; }
  .ai-act:hover { color: var(--primary); border-color: var(--primary); }
  .sources { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
             padding: 10px 14px; margin-top: 8px; font-size: 12.5px; box-shadow: var(--shadow); }
  .sources .stitle { color: var(--text-dim); margin-bottom: 6px; }
  .sources a { color: var(--primary); text-decoration: none; display: block;
              margin: 3px 0; word-break: break-all; }
  .sources a:hover { text-decoration: underline; }
  .trace { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 14px; margin-top: 8px; font-size: 13px; box-shadow: var(--shadow); }
  .trace .ttitle { color: var(--text-dim); margin-bottom: 6px; }
  .trace .titem { position: relative; margin-bottom: 8px; padding-left: 18px; }
  .trace .titem::before { content: ''; position: absolute; left: 3px; top: 6px;
    width: 7px; height: 7px; border-radius: 50%; background: var(--primary); }
  .trace .titem:not(:last-child)::after { content: ''; position: absolute; left: 6px; top: 16px;
    bottom: -10px; width: 1px; background: var(--border-2); }
  .trace .thead { color: var(--text); }
  .trace .tdur { color: var(--text-dim); font-size: 11px; margin-left: 6px; }
  .trace .ttool { display: inline-block; background: rgba(74,108,247,.12); color: var(--primary);
    border-radius: 4px; padding: 0 6px; margin-right: 6px; font-size: 12px; }
  .trace a { color: var(--primary); text-decoration: none; font-size: 12px; display: block;
    margin: 2px 0 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trace a:hover { text-decoration: underline; }
  .chartbox { background: #fff; border: 1px solid var(--border); border-radius: 12px;
    padding: 12px; margin-top: 8px; box-shadow: var(--shadow); }
  .chartbox .chead { display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 6px; }
  .chartbox .ctitle { color: #888; font-size: 12px; }
  .chartbox .cbtns { display: flex; gap: 4px; }
  .chartbox .cbtn { border: 1px solid var(--border-2); background: var(--panel); color: var(--text-sub);
    border-radius: 5px; font-size: 11px; padding: 1px 8px; cursor: pointer; }
  .chartbox .cbtn:hover, .chartbox .cbtn.on { color: var(--primary); border-color: var(--primary); }
  .chartbox .chart { width: 100%; height: 260px; }
  .chartbox table { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 8px; }
  .chartbox th { background: #f7f8fc; color: #666; text-align: left; padding: 5px 8px;
    border-bottom: 1px solid #ececf1; white-space: nowrap; }
  .chartbox td { padding: 5px 8px; border-bottom: 1px solid #f2f3f7; white-space: nowrap; }
  .chartbox .clineage { color: #aaa; font-size: 11px; margin-top: 6px; word-break: break-all; }
  .msg-ai h1, .msg-ai h2, .msg-ai h3 { margin: 10px 0 6px; font-size: 15px; color: var(--text); }
  .msg-ai table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 8px 0; }
  .msg-ai th { background: var(--th-bg); color: var(--text-sub); text-align: left; padding: 5px 8px; border: 1px solid var(--border); }
  .msg-ai td { padding: 5px 8px; border: 1px solid var(--border); }
  .msg-ai ul, .msg-ai ol { margin: 6px 0; padding-left: 20px; }
  .msg-ai li { margin: 3px 0; }
  .msg-ai p { margin: 6px 0; }
  .msg-ai code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .msg-ai pre { background: var(--code-bg); padding: 10px; border-radius: 8px; overflow-x: auto; }
  .msg-ai strong { color: var(--text); }
  .badge { display: inline-block; font-size: 11px; border-radius: 4px; padding: 1px 6px;
           margin-right: 6px; vertical-align: 1px; }
  .badge.ok { background: #e8f5e9; color: #2e7d32; }
  .badge.bad { background: #fdecea; color: #c62828; }
  .plan { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
         padding: 10px 14px; margin-bottom: 10px; font-size: 13px; box-shadow: var(--shadow); }
  .plan .pt { color: #1a6fb5; font-weight: 600; margin-bottom: 6px; }
  .plan .pstep { display: flex; align-items: center; gap: 8px; padding: 3px 0; color: var(--text-sub); }
  .plan .pstep .num { flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%;
                      background: var(--code-bg); color: var(--text-dim); font-size: 11px;
                      display: inline-flex; align-items: center; justify-content: center; }
  .plan .pstep.active .num { background: var(--primary); color: #fff; }
  .plan .pstep.done { color: #2e7d32; }
  .plan .pstep.done .num { background: #2e7d32; color: #fff; }
  .plan .pbar { height: 4px; background: var(--code-bg); border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .plan .pbar .fill { height: 100%; background: var(--primary); width: 0; transition: width .3s; }
  #inputbar { padding: 12px 16px 18px; }
  .inputbox { max-width: 780px; margin: 0 auto; }
  .modes { display: flex; gap: 8px; margin-bottom: 8px; }
  .mode-btn { border: 1px solid var(--border-2); background: var(--panel); border-radius: 16px;
              padding: 4px 14px; font-size: 12.5px; cursor: pointer; color: var(--text-sub); }
  .mode-btn.active { background: var(--primary); border-color: var(--primary); color: #fff; }
  .inputrow { display: flex; gap: 10px; align-items: flex-end; background: var(--panel);
              border: 1px solid var(--border-2); border-radius: 14px; padding: 8px;
              box-shadow: var(--shadow); }
  .inputrow:focus-within { border-color: var(--primary); }
  #input { flex: 1; border: none; outline: none; resize: none; font-size: 14px;
          font-family: inherit; min-height: 40px; max-height: 160px; line-height: 1.5;
          padding: 9px 8px; background: transparent; color: var(--text); overflow-y: auto; }
  #send { background: var(--primary); color: #fff; border: none; border-radius: 10px;
          padding: 0 20px; font-size: 14px; cursor: pointer; transition: background .15s; }
  #send:disabled { background: #aab6f5; cursor: not-allowed; }
  .empty-hint { max-width: 780px; margin: 15vh auto 0; text-align: center; color: var(--text-dim); }
  .empty-hint .big { font-size: 20px; margin-bottom: 10px; color: var(--text-sub); }
</style>
</head>
<body>
<div id="sidebar">
  <div class="brand">Agent Pipeline</div>
  <button id="newchat">＋ 新建对话</button>
  <div id="convlist"></div>
  <div class="foot">会话保存在本地浏览器</div>
</div>
<div id="main">
  <header>
    <span class="title" id="convTitle">新对话</span>
    <div class="hright"><span id="status">就绪</span><button id="roToggle" class="mode-btn" style="font-size:12px;padding:3px 10px;" title="开启后本会话只读查询不再逐次确认，直接放行（守门规则不变）">只读免确认：关</button><button id="themeToggle" title="切换深色/浅色主题">🌙</button></div>
  </header>
  <div id="chat"></div>
  <div id="inputbar">
    <div class="inputbox">
      <div class="modes">
        <button class="mode-btn" data-mode="off">直接回答</button>
        <button class="mode-btn active" data-mode="standard">标准思考</button>
        <button class="mode-btn" data-mode="deep">深度思考</button>
      </div>
      <div class="inputrow">
        <textarea id="input" placeholder="输入任务或问题，回车发送（Shift+回车换行）"></textarea>
        <button id="send">发送</button>
      </div>
    </div>
  </div>
</div>
<script>
// ---- 主题切换 ----
const themeToggle = document.getElementById('themeToggle');
function applyTheme(t) {
  document.body.classList.toggle('dark', t === 'dark');
  themeToggle.textContent = t === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('ap_theme', t); } catch (e) {}
}
applyTheme((function () { try { return localStorage.getItem('ap_theme') || 'light'; } catch (e) { return 'light'; } })());
themeToggle.onclick = function () {
  applyTheme(document.body.classList.contains('dark') ? 'light' : 'dark');
};
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');
const convList = document.getElementById('convlist');
const convTitle = document.getElementById('convTitle');

let mode = localStorage.getItem('agent_mode') || 'standard';
let roAuto = localStorage.getItem('agent_ro_auto') === '1';
const roToggle = document.getElementById('roToggle');
function renderRoToggle() {
  roToggle.classList.toggle('active', roAuto);
  roToggle.textContent = '只读免确认：' + (roAuto ? '开' : '关');
}
roToggle.addEventListener('click', () => {
  roAuto = !roAuto;
  try { localStorage.setItem('agent_ro_auto', roAuto ? '1' : '0'); } catch (e) {}
  renderRoToggle();
});
renderRoToggle();
let busy = false;

// ---------- 会话数据模型（localStorage 持久化） ----------
// convs: [{id, title, sid, created, messages: [{kind:'user'|'ai'|'thinking'|'tool', text}]}]
function loadConvs() {
  try { return JSON.parse(localStorage.getItem('agent_convs') || '[]'); }
  catch(e) { return []; }
}
function saveConvs() { localStorage.setItem('agent_convs', JSON.stringify(convs)); }
let convs = loadConvs();
let activeId = localStorage.getItem('agent_active') || '';

function activeConv() { return convs.find(c => c.id === activeId) || null; }

function newConv() {
  const c = { id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
              title: '新对话', sid: '', created: Date.now(), messages: [] };
  convs.unshift(c);
  activeId = c.id;
  saveConvs();
  renderSidebar();
  renderChat();
}

function delConv(id, ev) {
  ev.stopPropagation();
  const target = convs.find(c => c.id === id);
  convs = convs.filter(c => c.id !== id);
  if (activeId === id) activeId = convs.length ? convs[0].id : '';
  saveConvs();
  renderSidebar();
  renderChat();
  // 同步删除服务端会话（含消息/证据/计划），避免刷新后复现
  if (target && target.sid) {
    fetch('api/conversations/' + target.sid, { method: 'DELETE' })
      .catch(() => {});
  }
}

// ---------- 侧栏渲染 ----------
function renderSidebar() {
  convList.innerHTML = '';
  for (const c of convs) {
    const item = document.createElement('div');
    item.className = 'conv-item' + (c.id === activeId ? ' active' : '');
    const t = document.createElement('span');
    t.className = 'ctitle';
    t.textContent = c.title;
    const del = document.createElement('button');
    del.className = 'cdel';
    del.textContent = '×';
    del.title = '删除对话';
    del.addEventListener('click', e => delConv(c.id, e));
    item.appendChild(t); item.appendChild(del);
    item.addEventListener('click', () => {
      if (busy || c.id === activeId) return;
      activeId = c.id;
      localStorage.setItem('agent_active', activeId);
      renderSidebar(); renderChat();
    });
    convList.appendChild(item);
  }
}

// ---------- 聊天区渲染 ----------
function renderChat() {
  chat.innerHTML = '';
  const c = activeConv();
  convTitle.textContent = c ? c.title : '新对话';
  if (!c || !c.messages.length) {
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.innerHTML = '<div class="big">开始新的对话</div>输入任务，智能体会搜索、阅读网页并给出带来源的回答';
    chat.appendChild(hint);
    return;
  }
  for (const m of c.messages) appendMsgEl(m);
  chat.scrollTop = chat.scrollHeight;
}

function buildReportBox(rp) {
  const box = document.createElement('div');
  box.className = 'chartbox reportbox';
  const st = document.createElement('div');
  st.className = 'ctitle';
  st.textContent = '分析报告';
  box.appendChild(st);
  const concl = document.createElement('div');
  concl.style.cssText = 'font-weight:600;margin:6px 0;';
  concl.textContent = rp.conclusion || '';
  box.appendChild(concl);
  const sections = [['关键发现', 'findings'], ['数据证据', 'evidence'], ['风险与局限', 'risks'], ['建议', 'suggestions']];
  for (const [title, key] of sections) {
    const items = rp[key] || [];
    if (!items.length) continue;
    const h = document.createElement('div');
    h.style.cssText = 'color:#888;font-size:12px;margin:8px 0 4px;';
    h.textContent = title;
    box.appendChild(h);
    const ul = document.createElement('ul');
    ul.style.cssText = 'margin:0;padding-left:18px;font-size:13px;';
    for (const it of items) {
      const li = document.createElement('li');
      li.textContent = it;
      ul.appendChild(li);
    }
    box.appendChild(ul);
  }
  return box;
}
function appendChartBox(turn, payload) {
  const box = document.createElement('div');
  box.className = 'chartbox';
  const chead = document.createElement('div');
  chead.className = 'chead';
  const st = document.createElement('div');
  st.className = 'ctitle';
  st.textContent = '数据报表（' + payload.row_count + ' 行 · 语义层 v' + payload.sem_ver + '）';
  chead.appendChild(st);
  box.appendChild(chead);
  const chartEl = document.createElement('div');
  chartEl.className = 'chart';
  box.appendChild(chartEl);
  turn.appendChild(box);
  try { renderChart(chartEl, payload); } catch (e) { chartEl.textContent = '图表渲染失败'; }
  addChartActions(box, chartEl, payload);
  const tbl = document.createElement('table');
  const thead = document.createElement('tr');
  for (const c of payload.columns) {
    const th = document.createElement('th'); th.textContent = c; thead.appendChild(th);
  }
  tbl.appendChild(thead);
  for (const r of payload.rows.slice(0, 20)) {
    const tr = document.createElement('tr');
    for (const v of r) {
      const td = document.createElement('td'); td.textContent = String(v); tr.appendChild(td);
    }
    tbl.appendChild(tr);
  }
  box.appendChild(tbl);
}
function appendMsgEl(m) {
  const c = activeConv();
  if (m.kind === 'user') {
    const turn = lastTurn();
    const d = document.createElement('div');
    d.className = 'msg-user';
    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = m.text;
    d.appendChild(b); turn.appendChild(d);
  } else if (m.kind === 'thinking' || m.kind === 'tool') {
    const turn = lastTurn();
    const p = document.createElement('div');
    p.className = 'panel ' + m.kind;
    const head = document.createElement('div');
    head.className = 'head';
    head.innerHTML = '<span class="arrow">▶</span><span></span>';
    head.lastChild.textContent = m.kind === 'thinking' ? '思考过程' : '工具调用';
    const body = document.createElement('div');
    body.className = 'body';
    body.textContent = m.text;
    head.addEventListener('click', () => p.classList.toggle('open'));
    p.appendChild(head); p.appendChild(body); turn.appendChild(p);
  } else if (m.kind === 'ai') {
    const turn = lastTurn();
    const el = document.createElement('div');
    el.className = 'msg-ai';
    renderMarkdown(el, m.text);
    turn.appendChild(buildAIBlock(el, m));
    for (const cp of (m.charts || [])) appendChartBox(turn, cp);
    if (m.report) turn.appendChild(buildReportBox(m.report));
  }
  chat.scrollTop = chat.scrollHeight;
}

function lastTurn() {
  let t = chat.lastElementChild;
  if (!t || !t.classList.contains('turn')) {
    t = document.createElement('div');
    t.className = 'turn';
    chat.appendChild(t);
  }
  return t;
}

// ---------- AI 消息操作（复制/重新生成） ----------
function buildAIBlock(el, m) {
  const block = document.createElement('div');
  block.className = 'ai-block';
  block.appendChild(el);
  const acts = document.createElement('div');
  acts.className = 'ai-actions';
  const cp = document.createElement('button');
  cp.className = 'ai-act'; cp.textContent = '复制';
  cp.onclick = function () {
    const t = m.text || el.textContent || '';
    const done = () => { cp.textContent = '已复制'; setTimeout(() => cp.textContent = '复制', 1500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(done).catch(() => fallbackCopy(t, done));
    } else fallbackCopy(t, done);
  };
  acts.appendChild(cp);
  const rg = document.createElement('button');
  rg.className = 'ai-act'; rg.textContent = '重新生成';
  rg.onclick = function () { regenerate(m); };
  acts.appendChild(rg);
  block.appendChild(acts);
  return block;
}
function fallbackCopy(text, done) {
  const ta = document.createElement('textarea');
  ta.value = text; document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); done(); } catch (e) {}
  document.body.removeChild(ta);
}
function regenerate(m) {
  if (busy) return;
  const c = activeConv();
  const idx = c.messages.indexOf(m);
  if (idx < 0) return;
  let ui = idx - 1;
  while (ui >= 0 && c.messages[ui].kind !== 'user') ui--;
  if (ui < 0) return;
  const text = c.messages[ui].text;
  c.messages = c.messages.slice(0, ui);
  renderChat();
  input.value = text;
  send();
}

// ---------- 发送与流式 ----------
let curThinking = null, curTool = null, curAI = null;

function ensurePanel(kind) {
  const c = activeConv();
  const m = { kind, text: '' };
  c.messages.push(m);
  const turn = lastTurn();
  const p = document.createElement('div');
  p.className = 'panel ' + kind;
  const head = document.createElement('div');
  head.className = 'head';
  head.innerHTML = '<span class="arrow">▶</span><span></span>';
  head.lastChild.textContent = kind === 'thinking' ? '思考过程' : '工具调用';
  const body = document.createElement('div');
  body.className = 'body';
  head.addEventListener('click', () => p.classList.toggle('open'));
  p.appendChild(head); p.appendChild(body); turn.appendChild(p);
  chat.scrollTop = chat.scrollHeight;
  return { m, body };
}

function renderMarkdown(el, text) {
  if (typeof marked === 'undefined') { el.textContent = text; return; }
  try {
    el.innerHTML = marked.parse(text);
  } catch (e) {
    el.textContent = text;
  }
}
function ensureAI() {
  const c = activeConv();
  const m = { kind: 'ai', text: '' };
  c.messages.push(m);
  const turn = lastTurn();
  const el = document.createElement('div');
  el.className = 'msg-ai';
  turn.appendChild(buildAIBlock(el, m));
  return { m, el };
}

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  let c = activeConv();
  if (!c) { newConv(); c = activeConv(); }
  busy = true; sendBtn.disabled = true; input.value = '';
  statusEl.textContent = '处理中…';

  // 标题：首条用户消息
  if (c.title === '新对话') {
    c.title = text.slice(0, 18) + (text.length > 18 ? '…' : '');
    convTitle.textContent = c.title;
    renderSidebar();
  }

  c.messages.push({ kind: 'user', text });
  appendMsgEl(c.messages[c.messages.length - 1]);
  curThinking = null; curTool = null; curAI = null;

  try {
    const resp = await fetch('api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: c.sid, message: text, mode, auto_approve_readonly: roAuto}),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});
      const events = buf.split('\n\n');
      buf = events.pop();
      for (const ev of events) {
        const lines = ev.split('\n');
        let eventName = '', data = '';
        for (const ln of lines) {
          if (ln.startsWith('event: ')) eventName = ln.slice(7);
          if (ln.startsWith('data: ')) data = ln.slice(6);
        }
        if (!eventName) continue;
        const payload = JSON.parse(data);
        if (eventName === 'session') {
          c.sid = payload.session_id;
        } else if (eventName === 'plan') {
          const turn = lastTurn();
          const inner = document.createElement('div');
          inner.className = 'plan';
          const pt = document.createElement('div');
          pt.className = 'pt';
          pt.textContent = '任务计划';
          inner.appendChild(pt);
          payload.plan.steps.forEach((s, i) => {
            const row = document.createElement('div');
            row.className = 'pstep' + (i === 0 ? ' active' : '');
            const num = document.createElement('span');
            num.className = 'num';
            num.textContent = i + 1;
            const goal = document.createElement('span');
            goal.textContent = s.goal || s;
            row.appendChild(num); row.appendChild(goal);
            inner.appendChild(row);
          });
          const bar = document.createElement('div');
          bar.className = 'pbar';
          const fill = document.createElement('div');
          fill.className = 'fill';
          bar.appendChild(fill);
          inner.appendChild(bar);
          turn.appendChild(inner);
          chat.scrollTop = chat.scrollHeight;
        } else if (eventName === 'plan_progress') {
          const planEl = chat.querySelector('.turn:last-child .plan');
          if (planEl) {
            planEl.querySelectorAll('.pstep').forEach((row, i) => {
              row.classList.toggle('done', i < payload.step);
              row.classList.toggle('active', i === payload.step - 1);
            });
            const fill = planEl.querySelector('.fill');
            if (fill) fill.style.width = payload.progress + '%';
          }
        } else if (eventName === 'status') {
          if (!curThinking) curThinking = ensurePanel('thinking');
          curThinking.m.text += payload.text + '\n';
          curThinking.body.textContent += payload.text + '\n';
          curThinking.body.scrollTop = curThinking.body.scrollHeight;
          statusEl.textContent = '处理中…';
        } else if (eventName === 'thinking') {
          if (!curThinking) curThinking = ensurePanel('thinking');
          curThinking.m.text += payload.text;
          curThinking.body.textContent += payload.text;
          curThinking.body.scrollTop = curThinking.body.scrollHeight;
          statusEl.textContent = '深度思考中…';
        } else if (eventName === 'tool_start') {
          if (!curTool) curTool = ensurePanel('tool');
          curTool._t0 = Date.now();
          const line = '🔧 ' + payload.tool + ' ' + JSON.stringify(payload.args) + '\n';
          curTool.m.text += line;
          curTool.body.textContent += line;
          statusEl.textContent = '执行工具: ' + payload.tool;
        } else if (eventName === 'tool_end') {
          if (!curTool) curTool = ensurePanel('tool');
          const pv = payload.preview.startsWith('SQL:') ? payload.preview : payload.preview.slice(0, 100);
          const ms = curTool._t0 ? Date.now() - curTool._t0 : null;
          const dur = ms !== null ? '（' + (ms >= 1000 ? (ms / 1000).toFixed(1) + 's' : ms + 'ms') + '）' : '';
          const line = '   ↳ ' + pv + dur + '\n';
          curTool.m.text += line;
          curTool.body.textContent += line;
          curTool.body.scrollTop = curTool.body.scrollHeight;
        } else if (eventName === 'confirm_request') {
          const turn = lastTurn();
          const box = document.createElement('div');
          box.className = 'chartbox';
          const st = document.createElement('div');
          st.className = 'ctitle';
          st.textContent = '⚠ 查询确认（' + payload.tool + '）：' + (payload.reason || '');
          box.appendChild(st);
          const pre = document.createElement('pre');
          pre.style.cssText = 'margin:6px 0;padding:8px;background:rgba(0,0,0,.35);border-radius:6px;white-space:pre-wrap;word-break:break-all;font-size:12px;max-height:180px;overflow:auto;';
          const a = payload.args || {};
          pre.textContent = a.sql || a.plan_json || JSON.stringify(a, null, 2);
          box.appendChild(pre);
          const btns = document.createElement('div');
          btns.style.cssText = 'display:flex;gap:10px;margin:6px 0;';
          const ok = document.createElement('button');
          ok.textContent = '允许执行';
          ok.style.cssText = 'padding:5px 16px;border:none;border-radius:6px;background:#4caf50;color:#fff;cursor:pointer;';
          const no = document.createElement('button');
          no.textContent = '拒绝';
          no.style.cssText = 'padding:5px 16px;border:none;border-radius:6px;background:#e53935;color:#fff;cursor:pointer;';
          btns.appendChild(ok); btns.appendChild(no);
          box.appendChild(btns);
          turn.appendChild(box);
          chat.scrollTop = chat.scrollHeight;
          const done = (approved) => {
            ok.disabled = no.disabled = true;
            ok.style.opacity = no.style.opacity = .5;
            st.textContent = (approved ? '✓ 已允许' : '✗ 已拒绝') + '（' + payload.tool + '）';
            fetch('api/confirm', {method: 'POST', headers: {'Content-Type': 'application/json'},
              body: JSON.stringify({confirm_id: payload.confirm_id, approved})});
          };
          ok.addEventListener('click', () => done(true));
          no.addEventListener('click', () => done(false));
        } else if (eventName === 'reply') {
          if (!curAI) curAI = ensureAI();
          curAI.m.text += payload.text;
          renderMarkdown(curAI.el, curAI.m.text);
          chat.scrollTop = chat.scrollHeight;
          statusEl.textContent = '回复中…';
        } else if (eventName === 'sources') {
          const turn = lastTurn();
          const box = document.createElement('div');
          box.className = 'sources';
          const st = document.createElement('div');
          st.className = 'stitle';
          st.textContent = '引用来源';
          box.appendChild(st);
          for (const s of payload.sources) {
            const a = document.createElement('a');
            a.href = s.url; a.target = '_blank';
            const badge = document.createElement('span');
            badge.className = 'badge ' + (s.verified ? 'ok' : 'bad');
            badge.textContent = s.verified ? '已验证' : '未验证';
            a.appendChild(badge);
            a.appendChild(document.createTextNode((s.title || s.url).slice(0, 60)));
            box.appendChild(a);
          }
          turn.appendChild(box);
          chat.scrollTop = chat.scrollHeight;
        } else if (eventName === 'trace') {
          const turn = lastTurn();
          const box = document.createElement('div');
          box.className = 'trace';
          const st = document.createElement('div');
          st.className = 'ttitle';
          st.textContent = '执行轨迹（每轮调用的工具与查阅的网页）';
          box.appendChild(st);
          for (const t of payload.trace) {
            const item = document.createElement('div');
            item.className = 'titem';
            const head = document.createElement('div');
            head.className = 'thead';
            const tool = document.createElement('span');
            tool.className = 'ttool';
            tool.textContent = t.tool;
            head.appendChild(tool);
            head.appendChild(document.createTextNode('第' + t.round + '轮' + (t.query ? ' · ' + t.query : '')));
            if (t.elapsed_ms !== undefined && t.elapsed_ms !== null) {
              const dur = document.createElement('span');
              dur.className = 'tdur';
              dur.textContent = t.elapsed_ms >= 1000 ? (t.elapsed_ms / 1000).toFixed(1) + 's' : t.elapsed_ms + 'ms';
              head.appendChild(dur);
            }
            item.appendChild(head);
            for (const u of (t.urls || [])) {
              const a = document.createElement('a');
              a.href = u; a.target = '_blank'; a.textContent = u;
              item.appendChild(a);
            }
            box.appendChild(item);
          }
          turn.appendChild(box);
          chat.scrollTop = chat.scrollHeight;
        } else if (eventName === 'chart') {
          const turn = lastTurn();
          // 同一轮内新图表替换旧图表，避免重绘/美化时堆叠多图
          turn.querySelectorAll(':scope > .chartbox').forEach(b => b.remove());
          const box = document.createElement('div');
          box.className = 'chartbox';
          const st = document.createElement('div');
          st.className = 'ctitle';
          st.textContent = '数据报表（' + payload.row_count + ' 行 · 语义层 v' + payload.sem_ver + '）';
          box.appendChild(st);
          const chartEl = document.createElement('div');
          chartEl.className = 'chart';
          box.appendChild(chartEl);
          turn.appendChild(box);
          try { renderChart(chartEl, payload); } catch (e) { chartEl.textContent = '图表渲染失败'; }
          const tbl = document.createElement('table');
          const thead = document.createElement('tr');
          for (const c of payload.columns) {
            const th = document.createElement('th'); th.textContent = c; thead.appendChild(th);
          }
          tbl.appendChild(thead);
          for (const r of payload.rows.slice(0, 20)) {
            const tr = document.createElement('tr');
            for (const v of r) {
              const td = document.createElement('td'); td.textContent = String(v); tr.appendChild(td);
            }
            tbl.appendChild(tr);
          }
          box.appendChild(tbl);
          const lin = document.createElement('div');
          lin.className = 'clineage';
          lin.textContent = 'SQL: ' + payload.sql;
          box.appendChild(lin);
          chat.scrollTop = chat.scrollHeight;
        } else if (eventName === 'report') {
          const turn = lastTurn();
          turn.appendChild(buildReportBox(payload));
          chat.scrollTop = chat.scrollHeight;
        } else if (eventName === 'end') {
          statusEl.textContent = '完成 · ' + payload.steps + ' 步';
        }
      }
      saveConvs();
    }
  } catch (e) {
    if (!curAI) curAI = ensureAI();
    curAI.m.text = '连接失败: ' + e.message;
    renderMarkdown(curAI.el, curAI.m.text);
  }
  saveConvs();
  busy = false; sendBtn.disabled = false; input.focus();
}

// ---------- 图表渲染：按数据形态自动选型 ----------
function renderChart(el, payload) {
  if (typeof echarts === 'undefined') { el.textContent = 'ECharts 未加载'; return; }
  const chart = echarts.init(el);
  const cols = payload.columns;
  const rows = payload.rows;
  if (!rows.length) { chart.setOption({title: {text: '无数据', left: 'center', top: 'middle'}}); return; }
  // 自动识别维度列与数值列（兼容中文列名宽表）
  const isNum = v => v !== null && v !== '' && !isNaN(Number(v));
  const numIdx = [];
  const dimIdx = [];
  cols.forEach((c, i) => {
    const sample = rows.slice(0, 5).map(r => r[i]).filter(v => v !== null && v !== '');
    if (sample.length && sample.every(isNum)) numIdx.push(i); else dimIdx.push(i);
  });
  if (!numIdx.length) { chart.setOption({title: {text: '无数值列', left: 'center', top: 'middle'}}); return; }
  const labels = rows.map(r => dimIdx.map(i => r[i]).join(' '));
  const isTime = dimIdx.some(i => /date|日期|时间|周/.test(cols[i]));
  const mkSeries = (type) => numIdx.map(i => ({
    name: cols[i], type,
    data: rows.map(r => Number(r[i])),
    smooth: type === 'line', areaStyle: type === 'line' ? {opacity: 0.15} : undefined,
  }));
  const ctype = payload.chart_type || 'auto';
  let option;
  const legend = numIdx.length > 1 ? {data: numIdx.map(i => cols[i])} : undefined;
  const pieSeries = {type: 'pie', radius: ['35%', '65%'],
    data: rows.map((r, i) => ({name: labels[i], value: Number(r[numIdx[0]])}))};
  if (ctype === 'pie') {
    option = {
      tooltip: {trigger: 'item'},
      series: [pieSeries],
    };
  } else if (ctype === 'line') {
    option = {
      tooltip: {trigger: 'axis'},
      legend,
      xAxis: {type: 'category', data: labels},
      yAxis: {type: 'value'},
      series: mkSeries('line'),
      grid: {left: 50, right: 20, top: legend ? 40 : 20, bottom: 30},
    };
  } else if (ctype === 'bar') {
    option = {
      tooltip: {trigger: 'axis'},
      legend,
      xAxis: {type: 'category', data: labels, axisLabel: {rotate: labels.some(l => l.length > 6) ? 30 : 0}},
      yAxis: {type: 'value'},
      series: mkSeries('bar'),
      grid: {left: 50, right: 20, top: legend ? 40 : 20, bottom: 40},
    };
  } else if (isTime) {
    option = {
      tooltip: {trigger: 'axis'},
      legend,
      xAxis: {type: 'category', data: labels},
      yAxis: {type: 'value'},
      series: mkSeries('line'),
      grid: {left: 50, right: 20, top: legend ? 40 : 20, bottom: 30},
    };
  } else if (dimIdx.length === 1 && rows.length <= 8 && numIdx.length === 1) {
    option = {
      tooltip: {trigger: 'item'},
      series: [pieSeries],
    };
  } else {
    option = {
      tooltip: {trigger: 'axis'},
      legend,
      xAxis: {type: 'category', data: labels, axisLabel: {rotate: labels.some(l => l.length > 6) ? 30 : 0}},
      yAxis: {type: 'value'},
      series: mkSeries('bar'),
      grid: {left: 50, right: 20, top: legend ? 40 : 20, bottom: 40},
    };
  }
  chart.setOption(option);
  return chart;
}

// ---------- 图表操作（下载/图型切换） ----------
function addChartActions(box, chartEl, payload) {
  const head = box.querySelector('.chead') || box;
  let btns = head.querySelector('.cbtns');
  if (btns) btns.remove();
  btns = document.createElement('div');
  btns.className = 'cbtns';
  const dl = document.createElement('button');
  dl.className = 'cbtn'; dl.textContent = '下载PNG';
  dl.onclick = function () {
    const inst = echarts.getInstanceByDom(chartEl);
    if (!inst) return;
    const a = document.createElement('a');
    a.href = inst.getDataURL({type: 'png', pixelRatio: 2, backgroundColor: '#fff'});
    a.download = 'chart.png'; a.click();
  };
  btns.appendChild(dl);
  for (const t of ['bar', 'pie', 'line']) {
    const b = document.createElement('button');
    b.className = 'cbtn' + ((payload.chart_type || 'auto') === t ? ' on' : '');
    b.textContent = t === 'bar' ? '柱状' : t === 'pie' ? '饼图' : '折线';
    b.onclick = function () {
      const inst = echarts.getInstanceByDom(chartEl);
      if (inst) inst.dispose();
      payload.chart_type = t;
      renderChart(chartEl, payload);
      addChartActions(box, chartEl, payload);
    };
    btns.appendChild(b);
  }
  head.appendChild(btns);
}

// ---------- 模式与事件绑定 ----------
function syncModeBtns() {
  document.querySelectorAll('.mode-btn[data-mode]').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === mode));
}
syncModeBtns();
document.querySelectorAll('.mode-btn[data-mode]').forEach(b =>
  b.addEventListener('click', () => {
    mode = b.dataset.mode;
    localStorage.setItem('agent_mode', mode);
    syncModeBtns();
  }));

document.getElementById('newchat').addEventListener('click', () => {
  if (busy) return;
  newConv();
  statusEl.textContent = '就绪';
});

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});

// ---------- 服务端会话恢复 ----------
async function restoreFromServer() {
  try {
    const resp = await fetch('api/conversations');
    const data = await resp.json();
    convs = data.conversations.map(c => ({
      id: 's_' + c.session_id,
      sid: c.session_id,
      title: c.title,
      created: c.created_at * 1000,
      messages: [],
      loaded: false,
    }));
  } catch (e) {
    convs = [];
  }
  if (!convs.length) newConv();
  else {
    activeId = convs[0].id;
    renderSidebar();
    renderChat();
  }
}

async function loadConvMessages(conv) {
  if (conv.loaded) return;
  try {
    const resp = await fetch('api/conversations/' + conv.sid + '/messages');
    if (!resp.ok) { conv.loaded = true; return; }
    const data = await resp.json();
    conv.messages = data.messages.map(m => {
      if (m.role === 'user') return { kind: 'user', text: m.content };
      const content = m.content || '';
      const text = content.split('<!--CHART:')[0].split('<!--REPORT:')[0].trim();
      const charts = [];
      const re = /<!--CHART:(.*?)-->/gs;
      let mm;
      while ((mm = re.exec(content))) {
        try { charts.push(JSON.parse(mm[1])); } catch (e) {}
      }
      let report = null;
      const rm = /<!--REPORT:(.*?)-->/s.exec(content);
      if (rm) { try { report = JSON.parse(rm[1]); } catch (e) {} }
      return { kind: 'ai', text, charts, report };
    });
    conv.loaded = true;
  } catch (e) {
    conv.loaded = true;
  }
}

// 切换会话时按需加载历史（覆盖原点击处理中的渲染）
const _origRenderChat = renderChat;
renderChat = async function() {
  const c = activeConv();
  if (c && !c.loaded) await loadConvMessages(c);
  _origRenderChat();
};

// ---------- 初始化 ----------
restoreFromServer();
