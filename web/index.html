<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Pipeline</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #f7f7f8; height: 100vh; display: flex; }
  /* ---- 侧栏 ---- */
  #sidebar { width: 240px; background: #1e1f26; color: #d7d8e0; display: flex;
             flex-direction: column; flex-shrink: 0; }
  #sidebar .brand { padding: 16px 18px 12px; font-size: 15px; font-weight: 600;
                    color: #fff; letter-spacing: .5px; }
  #newchat { margin: 4px 12px 12px; background: #4a6cf7; color: #fff; border: none;
             border-radius: 10px; padding: 9px 0; font-size: 13.5px; cursor: pointer; }
  #newchat:hover { background: #3d5de6; }
  #convlist { flex: 1; overflow-y: auto; padding: 4px 8px; }
  .conv-item { padding: 9px 12px; border-radius: 9px; cursor: pointer; font-size: 13px;
               display: flex; align-items: center; justify-content: space-between;
               margin-bottom: 2px; color: #b9bac6; }
  .conv-item:hover { background: #2a2b35; color: #e8e9f0; }
  .conv-item.active { background: #313244; color: #fff; }
  .conv-item .ctitle { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .conv-item .cdel { visibility: hidden; color: #888; font-size: 14px; padding: 0 2px;
                     border: none; background: none; cursor: pointer; flex-shrink: 0; }
  .conv-item:hover .cdel { visibility: visible; }
  .conv-item .cdel:hover { color: #ff6b6b; }
  #sidebar .foot { padding: 10px 16px; font-size: 11px; color: #666878; }
  /* ---- 主区 ---- */
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { background: #fff; border-bottom: 1px solid #e8e8ec; padding: 10px 20px;
           display: flex; justify-content: space-between; align-items: center; }
  header .title { font-size: 14px; font-weight: 600; color: #1a1a2e; }
  #status { font-size: 12px; color: #999; }
  #chat { flex: 1; overflow-y: auto; padding: 24px 16px; }
  .turn { max-width: 780px; margin: 0 auto 20px; }
  .msg-user { display: flex; justify-content: flex-end; margin-bottom: 12px; }
  .msg-user .bubble { background: #4a6cf7; color: #fff; border-radius: 14px;
                      border-bottom-right-radius: 4px; padding: 10px 14px;
                      font-size: 14px; line-height: 1.6; max-width: 85%; white-space: pre-wrap; }
  .panel { background: #fff; border: 1px solid #ececf1; border-radius: 12px;
           margin-bottom: 10px; font-size: 13px; overflow: hidden; }
  .panel .head { padding: 8px 12px; cursor: pointer; user-select: none;
                 display: flex; align-items: center; gap: 6px; color: #666; }
  .panel .head:hover { background: #fafafc; }
  .panel .head .arrow { transition: transform .2s; font-size: 10px; color: #aaa; }
  .panel.open .head .arrow { transform: rotate(90deg); }
  .panel .body { display: none; padding: 4px 14px 10px; color: #555;
                 line-height: 1.7; white-space: pre-wrap; word-break: break-word;
                 max-height: 300px; overflow-y: auto; }
  .panel.open .body { display: block; }
  .panel.thinking .head { color: #9b7ede; }
  .panel.thinking .body { color: #8a7bb0; font-size: 12.5px; }
  .panel.tool .head { color: #4a8a5c; }
  .msg-ai { background: #fff; border: 1px solid #ececf1; border-radius: 14px;
            border-top-left-radius: 4px; padding: 12px 16px; font-size: 14px;
            line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
  .msg-ai.empty { display: none; }
  .sources { background: #fff; border: 1px solid #ececf1; border-radius: 12px;
             padding: 10px 14px; margin-top: 8px; font-size: 12.5px; }
  .sources .stitle { color: #888; margin-bottom: 6px; }
  .sources a { color: #4a6cf7; text-decoration: none; display: block;
              margin: 3px 0; word-break: break-all; }
  .sources a:hover { text-decoration: underline; }
  .trace { background: #fff; border: 1px solid #ececf1; border-radius: 12px;
    padding: 10px 14px; margin-top: 8px; font-size: 13px; }
  .trace .ttitle { color: #888; margin-bottom: 6px; }
  .trace .titem { margin-bottom: 6px; }
  .trace .thead { color: #333; }
  .trace .ttool { display: inline-block; background: #eef2ff; color: #4a6cf7;
    border-radius: 4px; padding: 0 6px; margin-right: 6px; font-size: 12px; }
  .trace a { color: #4a6cf7; text-decoration: none; font-size: 12px; display: block;
    margin: 2px 0 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trace a:hover { text-decoration: underline; }
  .chartbox { background: #fff; border: 1px solid #ececf1; border-radius: 12px;
    padding: 12px; margin-top: 8px; }
  .chartbox .ctitle { color: #888; font-size: 12px; margin-bottom: 6px; }
  .chartbox .chart { width: 100%; height: 260px; }
  .chartbox table { border-collapse: collapse; width: 100%; font-size: 12px; margin-top: 8px; }
  .chartbox th { background: #f7f8fc; color: #666; text-align: left; padding: 5px 8px;
    border-bottom: 1px solid #ececf1; white-space: nowrap; }
  .chartbox td { padding: 5px 8px; border-bottom: 1px solid #f2f3f7; white-space: nowrap; }
  .chartbox .clineage { color: #aaa; font-size: 11px; margin-top: 6px; word-break: break-all; }
  .badge { display: inline-block; font-size: 11px; border-radius: 4px; padding: 1px 6px;
           margin-right: 6px; vertical-align: 1px; }
  .badge.ok { background: #e8f5e9; color: #2e7d32; }
  .badge.bad { background: #fdecea; color: #c62828; }
  .plan { background: #fff; border: 1px solid #ececf1; border-radius: 12px;
         padding: 10px 14px; margin-bottom: 10px; font-size: 13px; }
  .plan .pt { color: #1a6fb5; font-weight: 600; margin-bottom: 6px; }
  .plan .pstep { display: flex; align-items: center; gap: 8px; padding: 3px 0; color: #666; }
  .plan .pstep .num { flex-shrink: 0; width: 18px; height: 18px; border-radius: 50%;
                      background: #eef0f4; color: #888; font-size: 11px;
                      display: inline-flex; align-items: center; justify-content: center; }
  .plan .pstep.active .num { background: #4a6cf7; color: #fff; }
  .plan .pstep.done { color: #2e7d32; }
  .plan .pstep.done .num { background: #2e7d32; color: #fff; }
  .plan .pbar { height: 4px; background: #eef0f4; border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .plan .pbar .fill { height: 100%; background: #4a6cf7; width: 0; transition: width .3s; }
  #inputbar { padding: 12px 16px 18px; }
  .inputbox { max-width: 780px; margin: 0 auto; }
  .modes { display: flex; gap: 8px; margin-bottom: 8px; }
  .mode-btn { border: 1px solid #d8dae2; background: #fff; border-radius: 16px;
              padding: 4px 14px; font-size: 12.5px; cursor: pointer; color: #666; }
  .mode-btn.active { background: #4a6cf7; border-color: #4a6cf7; color: #fff; }
  .inputrow { display: flex; gap: 10px; background: #fff; border: 1px solid #d8dae2;
              border-radius: 14px; padding: 8px; }
  .inputrow:focus-within { border-color: #4a6cf7; }
  #input { flex: 1; border: none; outline: none; resize: none; font-size: 14px;
          font-family: inherit; height: 40px; line-height: 40px; padding: 0 8px; }
  #send { background: #4a6cf7; color: #fff; border: none; border-radius: 10px;
          padding: 0 20px; font-size: 14px; cursor: pointer; }
  #send:disabled { background: #aab6f5; cursor: not-allowed; }
  .empty-hint { max-width: 780px; margin: 15vh auto 0; text-align: center; color: #b0b2bd; }
  .empty-hint .big { font-size: 20px; margin-bottom: 10px; color: #8a8da0; }
</style>
</head>
<body>
<div id="sidebar">
  <div class="brand">Agent Pipeline</div>
  <button id="newchat">＋ 新建对话</button>
  <div id="convlist"></div>
  <div class="foot">会话保存在本地浏览器</div>
</div>
<div id="main">
  <header>
    <span class="title" id="convTitle">新对话</span>
    <span id="status">就绪</span>
  </header>
  <div id="chat"></div>
  <div id="inputbar">
    <div class="inputbox">
      <div class="modes">
        <button class="mode-btn" data-mode="off">直接回答</button>
        <button class="mode-btn active" data-mode="standard">标准思考</button>
        <button class="mode-btn" data-mode="deep">深度思考</button>
      </div>
      <div class="inputrow">
        <textarea id="input" placeholder="输入任务或问题，回车发送（Shift+回车换行）"></textarea>
        <button id="send">发送</button>
      </div>
    </div>
  </div>
</div>
<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const statusEl = document.getElementById('status');
const convList = document.getElementById('convlist');
const convTitle = document.getElementById('convTitle');

let mode = localStorage.getItem('agent_mode') || 'standard';
let busy = false;

// ---------- 会话数据模型（localStorage 持久化） ----------
// convs: [{id, title, sid, created, messages: [{kind:'user'|'ai'|'thinking'|'tool', text}]}]
function loadConvs() {
  try { return JSON.parse(localStorage.getItem('agent_convs') || '[]'); }
  catch(e) { return []; }
}
function saveConvs() { localStorage.setItem('agent_convs', JSON.stringify(convs)); }
let convs = loadConvs();
let activeId = localStorage.getItem('agent_active') || '';

function activeConv() { return convs.find(c => c.id === activeId) || null; }

function newConv() {
  const c = { id: 'c' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
              title: '新对话', sid: '', created: Date.now(), messages: [] };
  convs.unshift(c);
  activeId = c.id;
  saveConvs();
  renderSidebar();
  renderChat();
}

function delConv(id, ev) {
  ev.stopPropagation();
  const target = convs.find(c => c.id === id);
  convs = convs.filter(c => c.id !== id);
  if (activeId === id) activeId = convs.length ? convs[0].id : '';
  saveConvs();
  renderSidebar();
  renderChat();
  // 同步删除服务端会话（含消息/证据/计划），避免刷新后复现
  if (target && target.sid) {
    fetch('/agent/api/conversations/' + target.sid, { method: 'DELETE' })
      .catch(() => {});
  }
}

// ---------- 侧栏渲染 ----------
function renderSidebar() {
  convList.innerHTML = '';
  for (const c of convs) {
    const item = document.createElement('div');
    item.className = 'conv-item' + (c.id === activeId ? ' active' : '');
    const t = document.createElement('span');
    t.className = 'ctitle';
    t.textContent = c.title;
    const del = document.createElement('button');
    del.className = 'cdel';
    del.textContent = '×';
    del.title = '删除对话';
    del.addEventListener('click', e => delConv(c.id, e));
    item.appendChild(t); item.appendChild(del);
    item.addEventListener('click', () => {
      if (busy || c.id === activeId) return;
      activeId = c.id;
      localStorage.setItem('agent_active', activeId);
      renderSidebar(); renderChat();
    });
    convList.appendChild(item);
  }
}

// ---------- 聊天区渲染 ----------
function renderChat() {
  chat.innerHTML = '';
  const c = activeConv();
  convTitle.textContent = c ? c.title : '新对话';
  if (!c || !c.messages.length) {
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.innerHTML = '<div class="big">开始新的对话</div>输入任务，智能体会搜索、阅读网页并给出带来源的回答';
    chat.appendChild(hint);
    return;
  }
  for (const m of c.messages) appendMsgEl(m);
  chat.scrollTop = chat.scrollHeight;
}

function appendChartBox(turn, payload) {
  const box = document.createElement('div');
  box.className = 'chartbox';
  const st = document.createElement('div');
  st.className = 'ctitle';
  st.textContent = '数据报表（' + payload.row_count + ' 行 · 语义层 v' + payload.sem_ver + '）';
  box.appendChild(st);
  const chartEl = document.createElement('div');
  chartEl.className = 'chart';
  box.appendChild(chartEl);
  turn.appendChild(box);
  try { renderChart(chartEl, payload); } catch (e) { chartEl.textContent = '图表渲染失败'; }
  const tbl = document.createElement('table');
  const thead = document.createElement('tr');
  for (const c of payload.columns) {
    const th = document.createElement('th'); th.textContent = c; thead.appendChild(th);
  }
  tbl.appendChild(thead);
  for (const r of payload.rows.slice(0, 20)) {
    const tr = document.createElement('tr');
    for (const v of r) {
      const td = document.createElement('td'); td.textContent = String(v); tr.appendChild(td);
    }
    tbl.appendChild(tr);
  }
  box.appendChild(tbl);
}
function appendMsgEl(m) {
  const c = activeConv();
  if (m.kind === 'user') {
    const turn = lastTurn();
    const d = document.createElement('div');
    d.className = 'msg-user';
    const b = document.createElement('div');
    b.className = 'bubble';
    b.textContent = m.text;
    d.appendChild(b); turn.appendChild(d);
  } else if (m.kind === 'thinking' || m.kind === 'tool') {
    const turn = lastTurn();
    const p = document.createElement('div');
    p.className = 'panel ' + m.kind;
    const head = document.createElement('div');
    head.className = 'head';
    head.innerHTML = '<span class="arrow">▶</span><span></span>';
    head.lastChild.textContent = m.kind === 'thinking' ? '思考过程' : '工具调用';
    const body = document.createElement('div');
    body.className = 'body';
    body.textContent = m.text;
    head.addEventListener('click', () => p.classList.toggle('open'));
    p.appendChild(head); p.appendChild(body); turn.appendChild(p);
  } else if (m.kind === 'ai') {
    const turn = lastTurn();
    const el = document.createElement('div');
    el.className = 'msg-ai';
    el.textContent = m.text;
    turn.appendChild(el);
    for (const cp of (m.charts || [])) appendChartBox(turn, cp);
  }
  chat.scrollTop = chat.scrollHeight;
}

function lastTurn() {
  let t = chat.lastElementChild;
  if (!t || !t.classList.contains('turn')) {
    t = document.createElement('div');
    t.className = 'turn';
    chat.appendChild(t);
  }
  return t;
}

// ---------- 发送与流式 ----------
let curThinking = null, curTool = null, curAI = null;

function ensurePanel(kind) {
  const c = activeConv();
  const m = { kind, text: '' };
  c.messages.push(m);
  const turn = lastTurn();
  const p = document.createElement('div');
  p.className = 'panel ' + kind;
  const head = document.createElement('div');
  head.className = 'head';
  head.innerHTML = '<span class="arrow">▶</span><span></span>';
  head.lastChild.textContent = kind === 'thinking' ? '思考过程' : '工具调用';
  const body = document.createElement('div');
  body.className = 'body';
  head.addEventListener('click', () => p.classList.toggle('open'));
  p.appendChild(head); p.appendChild(body); turn.appendChild(p);
  chat.scrollTop = chat.scrollHeight;
  return { m, body };
}

function ensureAI() {
  const c = activeConv();
  const m = { kind: 'ai', text: '' };
  c.messages.push(m);
  const turn = lastTurn();
  const el = document.createElement('div');
  el.className = 'msg-ai';
  turn.appendChild(el);
  return { m, el };
}

async function send() {
  const text = input.value.trim();
  if (!text || busy) return;
  let c = activeConv();
  if (!c) { newConv(); c = activeConv(); }
  busy = true; sendBtn.disabled = true; input.value = '';
  statusEl.textContent = '处理中…';

  // 标题：首条用户消息
  if (c.title === '新对话') {
    c.title = text.slice(0, 18) + (text.length > 18 ? '…' : '');
    convTitle.textContent = c.title;
    renderSidebar();
  }

  c.messages.push({ kind: 'user', text });
  appendMsgEl(c.messages[c.messages.length - 1]);
  curThinking = null; curTool = null; curAI = null;

  try {
    const resp = await fetch('api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session_id: c.sid, message: text, mode}),
    });
    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += decoder.decode(value, {stream: true});
      const events = buf.split('\n\n');
      buf = events.pop();
      for (const ev of events) {
        const lines = ev.split('\n');
        let eventName = '', data = '';
        for (const ln of lines) {
          if (ln.startsWith('event: ')) eventName = ln.slice(7);
          if (ln.startsWith('data: ')) data = ln.slice(6);
        }
        if (!eventName) continue;
        const payload = JSON.parse(data);
        if (eventName === 'session') {
          c.sid = payload.session_id;
        } else if (eventName === 'plan') {
          const turn = lastTurn();
          const inner = document.createElement('div');
          inner.className = 'plan';
          const pt = document.createElement('div');
          pt.className = 'pt';
          pt.textContent = '任务计划';
          inner.appendChild(pt);
          payload.plan.steps.forEach((s, i) => {
            const row = document.createElement('div');
            row.className = 'pstep' + (i === 0 ? ' active' : '');
            const num = document.createElement('span');
            num.className = 'num';
            num.textContent = i + 1;
            const goal = document.createElement('span');
            goal.textContent = s.goal;
            row.appendChild(num); row.appendChild(goal);
            inner.appendChild(row);
          });
          const bar = document.createElement('div');
          bar.className = 'pbar';
          const fill = document.createElement('div');
          fill.className = 'fill';
          bar.appendChild(fill);
          inner.appendChild(bar);
          turn.appendChild(inner);
          chat.scrollTop = chat.scrollHeight;
        } else if (eventName === 'plan_progress') {
          const planEl = chat.querySelector('.turn:last-child .plan');
          if (planEl) {
            planEl.querySelectorAll('.pstep').forEach((row, i) => {
              row.classList.toggle('done', i < payload.step);
              row.classList.toggle('active', i === payload.step - 1);
            });
            const fill = planEl.querySelector('.fill');
            if (fill) fill.style.width = payload.progress + '%';
          }
        } else if (eventName === 'thinking') {
          if (!curThinking) curThinking = ensurePanel('thinking');
          curThinking.m.text += payload.text;
          curThinking.body.textContent += payload.text;
          curThinking.body.scrollTop = curThinking.body.scrollHeight;
          statusEl.textContent = '深度思考中…';
        } else if (eventName === 'tool_start') {
          if (!curTool) curTool = ensurePanel('tool');
          const line = '🔧 ' + payload.tool + ' ' + JSON.stringify(payload.args) + '\n';
          curTool.m.text += line;
          curTool.body.textContent += line;
          statusEl.textContent = '执行工具: ' + payload.tool;
        } else if (eventName === 'tool_end') {
          if (!curTool) curTool = ensurePanel('tool');
          const pv = payload.preview.startsWith('SQL:') ? payload.preview : payload.preview.slice(0, 100);
          const line = '   ↳ ' + pv + '\n';
          curTool.m.text += line;
          curTool.body.textContent += line;
          curTool.body.scrollTop = curTool.body.scrollHeight;
        } else if (eventName === 'reply') {
          if (!curAI) curAI = ensureAI();
          curAI.m.text += payload.text;
          curAI.el.textContent = curAI.m.text;
          chat.scrollTop = chat.scrollHeight;
          statusEl.textContent = '回复中…';
        } else if (eventName === 'sources') {
          const turn = lastTurn();
          const box = document.createElement('div');
          box.className = 'sources';
          const st = document.createElement('div');
          st.className = 'stitle';
          st.textContent = '引用来源';
          box.appendChild(st);
          for (const s of payload.sources) {
            const a = document.createElement('a');
            a.href = s.url; a.target = '_blank';
            const badge = document.createElement('span');
            badge.className = 'badge ' + (s.verified ? 'ok' : 'bad');
            badge.textContent = s.verified ? '已验证' : '未验证';
            a.appendChild(badge);
            a.appendChild(document.createTextNode((s.title || s.url).slice(0, 60)));
            box.appendChild(a);
          }
          turn.appendChild(box);
          chat.scrollTop = chat.scrollHeight;
        } else if (eventName === 'trace') {
          const turn = lastTurn();
          const box = document.createElement('div');
          box.className = 'trace';
          const st = document.createElement('div');
          st.className = 'ttitle';
          st.textContent = '执行轨迹（每轮调用的工具与查阅的网页）';
          box.appendChild(st);
          for (const t of payload.trace) {
            const item = document.createElement('div');
            item.className = 'titem';
            const head = document.createElement('div');
            head.className = 'thead';
            const tool = document.createElement('span');
            tool.className = 'ttool';
            tool.textContent = t.tool;
            head.appendChild(tool);
            head.appendChild(document.createTextNode('第' + t.round + '轮' + (t.query ? ' · ' + t.query : '')));
            item.appendChild(head);
            for (const u of (t.urls || [])) {
              const a = document.createElement('a');
              a.href = u; a.target = '_blank'; a.textContent = u;
              item.appendChild(a);
            }
            box.appendChild(item);
          }
          turn.appendChild(box);
          chat.scrollTop = chat.scrollHeight;
        } else if (eventName === 'chart') {
          const turn = lastTurn();
          // 同一轮内新图表替换旧图表，避免重绘/美化时堆叠多图
          turn.querySelectorAll(':scope > .chartbox').forEach(b => b.remove());
          const box = document.createElement('div');
          box.className = 'chartbox';
          const st = document.createElement('div');
          st.className = 'ctitle';
          st.textContent = '数据报表（' + payload.row_count + ' 行 · 语义层 v' + payload.sem_ver + '）';
          box.appendChild(st);
          const chartEl = document.createElement('div');
          chartEl.className = 'chart';
          box.appendChild(chartEl);
          turn.appendChild(box);
          try { renderChart(chartEl, payload); } catch (e) { chartEl.textContent = '图表渲染失败'; }
          const tbl = document.createElement('table');
          const thead = document.createElement('tr');
          for (const c of payload.columns) {
            const th = document.createElement('th'); th.textContent = c; thead.appendChild(th);
          }
          tbl.appendChild(thead);
          for (const r of payload.rows.slice(0, 20)) {
            const tr = document.createElement('tr');
            for (const v of r) {
              const td = document.createElement('td'); td.textContent = String(v); tr.appendChild(td);
            }
            tbl.appendChild(tr);
          }
          box.appendChild(tbl);
          const lin = document.createElement('div');
          lin.className = 'clineage';
          lin.textContent = 'SQL: ' + payload.sql;
          box.appendChild(lin);
          chat.scrollTop = chat.scrollHeight;
        } else if (eventName === 'end') {
          statusEl.textContent = '完成 · ' + payload.steps + ' 步';
        }
      }
      saveConvs();
    }
  } catch (e) {
    if (!curAI) curAI = ensureAI();
    curAI.m.text = '连接失败: ' + e.message;
    curAI.el.textContent = curAI.m.text;
  }
  saveConvs();
  busy = false; sendBtn.disabled = false; input.focus();
}

// ---------- 图表渲染：按数据形态自动选型 ----------
function renderChart(el, payload) {
  if (typeof echarts === 'undefined') { el.textContent = 'ECharts 未加载'; return; }
  const chart = echarts.init(el);
  const cols = payload.columns;
  const rows = payload.rows;
  if (!rows.length) { chart.setOption({title: {text: '无数据', left: 'center', top: 'middle'}}); return; }
  // 自动识别维度列与数值列（兼容中文列名宽表）
  const isNum = v => v !== null && v !== '' && !isNaN(Number(v));
  const numIdx = [];
  const dimIdx = [];
  cols.forEach((c, i) => {
    const sample = rows.slice(0, 5).map(r => r[i]).filter(v => v !== null && v !== '');
    if (sample.length && sample.every(isNum)) numIdx.push(i); else dimIdx.push(i);
  });
  if (!numIdx.length) { chart.setOption({title: {text: '无数值列', left: 'center', top: 'middle'}}); return; }
  const labels = rows.map(r => dimIdx.map(i => r[i]).join(' '));
  const isTime = dimIdx.some(i => /date|日期|时间|周/.test(cols[i]));
  const mkSeries = (type) => numIdx.map(i => ({
    name: cols[i], type,
    data: rows.map(r => Number(r[i])),
    smooth: type === 'line', areaStyle: type === 'line' ? {opacity: 0.15} : undefined,
  }));
  const ctype = payload.chart_type || 'auto';
  let option;
  const legend = numIdx.length > 1 ? {data: numIdx.map(i => cols[i])} : undefined;
  const pieSeries = {type: 'pie', radius: ['35%', '65%'],
    data: rows.map((r, i) => ({name: labels[i], value: Number(r[numIdx[0]])}))};
  if (ctype === 'pie') {
    option = {
      tooltip: {trigger: 'item'},
      series: [pieSeries],
    };
  } else if (ctype === 'line') {
    option = {
      tooltip: {trigger: 'axis'},
      legend,
      xAxis: {type: 'category', data: labels},
      yAxis: {type: 'value'},
      series: mkSeries('line'),
      grid: {left: 50, right: 20, top: legend ? 40 : 20, bottom: 30},
    };
  } else if (ctype === 'bar') {
    option = {
      tooltip: {trigger: 'axis'},
      legend,
      xAxis: {type: 'category', data: labels, axisLabel: {rotate: labels.some(l => l.length > 6) ? 30 : 0}},
      yAxis: {type: 'value'},
      series: mkSeries('bar'),
      grid: {left: 50, right: 20, top: legend ? 40 : 20, bottom: 40},
    };
  } else if (isTime) {
    option = {
      tooltip: {trigger: 'axis'},
      legend,
      xAxis: {type: 'category', data: labels},
      yAxis: {type: 'value'},
      series: mkSeries('line'),
      grid: {left: 50, right: 20, top: legend ? 40 : 20, bottom: 30},
    };
  } else if (dimIdx.length === 1 && rows.length <= 8 && numIdx.length === 1) {
    option = {
      tooltip: {trigger: 'item'},
      series: [pieSeries],
    };
  } else {
    option = {
      tooltip: {trigger: 'axis'},
      legend,
      xAxis: {type: 'category', data: labels, axisLabel: {rotate: labels.some(l => l.length > 6) ? 30 : 0}},
      yAxis: {type: 'value'},
      series: mkSeries('bar'),
      grid: {left: 50, right: 20, top: legend ? 40 : 20, bottom: 40},
    };
  }
  chart.setOption(option);
}

// ---------- 模式与事件绑定 ----------
function syncModeBtns() {
  document.querySelectorAll('.mode-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.mode === mode));
}
syncModeBtns();
document.querySelectorAll('.mode-btn').forEach(b =>
  b.addEventListener('click', () => {
    mode = b.dataset.mode;
    localStorage.setItem('agent_mode', mode);
    syncModeBtns();
  }));

document.getElementById('newchat').addEventListener('click', () => {
  if (busy) return;
  newConv();
  statusEl.textContent = '就绪';
});

sendBtn.addEventListener('click', send);
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

// ---------- 服务端会话恢复 ----------
async function restoreFromServer() {
  try {
    const resp = await fetch('api/conversations');
    const data = await resp.json();
    convs = data.conversations.map(c => ({
      id: 's_' + c.session_id,
      sid: c.session_id,
      title: c.title,
      created: c.created_at * 1000,
      messages: [],
      loaded: false,
    }));
  } catch (e) {
    convs = [];
  }
  if (!convs.length) newConv();
  else {
    activeId = convs[0].id;
    renderSidebar();
    renderChat();
  }
}

async function loadConvMessages(conv) {
  if (conv.loaded) return;
  try {
    const resp = await fetch('api/conversations/' + conv.sid + '/messages');
    if (!resp.ok) { conv.loaded = true; return; }
    const data = await resp.json();
    conv.messages = data.messages.map(m => {
      if (m.role === 'user') return { kind: 'user', text: m.content };
      const content = m.content || '';
      const text = content.split('<!--CHART:')[0].trim();
      const charts = [];
      const re = /<!--CHART:(.*?)-->/gs;
      let mm;
      while ((mm = re.exec(content))) {
        try { charts.push(JSON.parse(mm[1])); } catch (e) {}
      }
      return { kind: 'ai', text, charts };
    });
    conv.loaded = true;
  } catch (e) {
    conv.loaded = true;
  }
}

// 切换会话时按需加载历史（覆盖原点击处理中的渲染）
const _origRenderChat = renderChat;
renderChat = async function() {
  const c = activeConv();
  if (c && !c.loaded) await loadConvMessages(c);
  _origRenderChat();
};

// ---------- 初始化 ----------
restoreFromServer();
</script>
